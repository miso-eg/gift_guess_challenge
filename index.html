<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6555c7"><title>ギフト当てチャレンジ</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="brand-icon">?</span><div><h1>ギフト当てチャレンジ</h1></div></div><span id="saveStatus" role="status">読み込み中…</span></header>
<main><div class="workspace"><nav class="tabs" aria-label="操作モード"><button data-tab="play" class="active">進行</button><button data-tab="setup">設定</button><button data-tab="questions">ヒント設定</button><button data-tab="storage">保存・共有</button></nav><div id="editor"></div></div><aside><div class="preview-top"><div><h2>配信用プレビュー</h2></div><button id="export" class="primary">画像を保存</button></div><p class="muted">正解ギフトは出力されません。ヒントは画像に収まる分だけ、最新のものを表示します。</p><div class="canvas-wrap"><canvas id="preview" width="1080" height="1500" aria-label="配信用画像プレビュー"></canvas></div></aside></main>
<div id="toast" role="status"></div>
<dialog id="editDialog"><form id="editForm"><h2 id="editTitle">ヒントを訂正</h2><label for="editText">質問文</label><textarea id="editText" maxlength="240" required></textarea><div id="editAnswerField"><label for="editAnswer">回答</label><select id="editAnswer"><option value="yes">Yes · はい</option><option value="no">No · いいえ</option><option value="unknown">分からない</option><option value="neither">どちらともいえない</option></select></div><div class="actions"><button type="submit" class="primary" id="editSave">保存する</button><button type="button" id="editCancel">キャンセル</button></div></form></dialog>
<dialog id="cropDialog"><h2>ギフト画像を調整</h2><p class="muted">枠内が保存される範囲です。ドラッグで位置を調整できます。</p><div class="crop-stage"><canvas id="cropCanvas" width="400" height="400"></canvas><div class="crop-frame" aria-hidden="true"></div></div><label>拡大<input id="cropZoom" type="range" min="1" max="4" step="0.01" value="1"></label><div class="actions"><button id="cropWhole">画像全体を使う</button><button id="cropCancel">キャンセル</button><button id="cropSave" class="primary">この範囲を使う</button></div></dialog>
<dialog id="imageDialog"><h2>配信用画像を保存</h2><p class="muted">PNG保存ボタンで保存できます。スマートフォンでは画像の長押しでも保存できます。</p><div class="actions"><button id="downloadImage" class="primary">PNGを保存</button><button onclick="this.closest('dialog').close()">閉じる</button></div><img id="outputImage" alt="出力用画像"></dialog>
<dialog id="linkDialog"><h2 id="linkTitle">共有リンク</h2><p>このリンクを知る人は操作できます。公開しないでください。</p><input id="linkValue" readonly><div class="actions"><button id="copyLink">コピー</button><button onclick="this.closest('dialog').close()">閉じる</button></div></dialog>
<input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp" hidden><input type="file" id="backupFile" accept="application/json,.json" hidden>
<script src="config.js"></script><script type="module" src="app.js"></script></body></html>
